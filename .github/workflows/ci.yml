name: CI

on:
  pull_request:
  push:
    branches-ignore: [ master ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # pinned Playwright + its matching Chromium; CI=true makes the browser
      # tests fail (not skip) if they cannot run
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
