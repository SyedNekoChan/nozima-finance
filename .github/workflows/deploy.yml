name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Deploys the TURN credential Worker (worker/). The Cloudflare TURN key id
  # and API token live only as Worker secrets; they never enter the Pages build.
  worker:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - id: deploy
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            TURN_KEY_ID
            TURN_API_TOKEN
        env:
          TURN_KEY_ID: ${{ secrets.CF_TURN_KEY_ID }}
          TURN_API_TOKEN: ${{ secrets.CF_TURN_API_TOKEN }}

  build:
    runs-on: ubuntu-latest
    needs: worker
    if: ${{ always() }}
    env:
      WORKER_URL: ${{ needs.worker.outputs.url }}
      PAGES_ORIGIN: https://${{ github.repository_owner }}.github.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Runtime (non-secret) config: only the Worker URL, written as a static
      # file. Nothing about TURN is inlined into the JavaScript bundle.
      - name: Write sync-config.json
        run: |
          printf '{ "turnCredentialsUrl": "%s" }\n' "${WORKER_URL:+${WORKER_URL%/}/ice}" > public/sync-config.json
          cat public/sync-config.json

      # Verify the deployed Worker really returns usable short-lived TURN
      # (UDP + TCP + TLS/443) for the Pages origin, and leaks no secrets.
      - name: Verify TURN credential endpoint
        if: ${{ env.WORKER_URL != '' }}
        run: |
          set -euo pipefail
          URL="${WORKER_URL%/}/ice"
          BODY="$(curl -fsS -H "Origin: ${PAGES_ORIGIN}" "$URL")"
          echo "$BODY" | jq -e '[.iceServers[].urls[]] | any(startswith("turn:")) and any(startswith("turns:")) and any(test("transport=udp")) and any(test("transport=tcp"))' >/dev/null
          echo "$BODY" | jq -e '[.iceServers[] | select(.credential != null)] | length > 0' >/dev/null
          echo "$BODY" | jq -e '.ttl > 0' >/dev/null
          if echo "$BODY" | grep -q "TURN_API_TOKEN"; then echo "secret leaked"; exit 1; fi
          CODE="$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://example.invalid' "$URL")"
          test "$CODE" = "403"
          echo "TURN endpoint OK: UDP/TCP/TLS present, credentials short-lived, foreign origin rejected"

      - run: npm install
      - run: npm run build

      - name: Verify build output
        run: |
          test -f dist/sync-config.json
          cat dist/sync-config.json
          if grep -rIl "TURN_API_TOKEN\|CF_TURN" dist >/dev/null; then echo "secret reference in bundle"; exit 1; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
